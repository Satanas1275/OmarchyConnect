[package]
name = "omarchy-connect-server"
version = "0.1.0"
edition = "2021"
description = "Relais OmarchyConnect : pairing, routage opaque (E2E), jamais de clé en clair"
license = "MIT"

[[bin]]
name = "omarchy-connect-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rand = "0.8"
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["der"] }
signature = "2"
base64 = "0.22"
futures = "0.3"

[profile.release]
lto = true
strip = true
