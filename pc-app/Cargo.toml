[package]
name = "omarchy-connect"
version = "0.1.0"
edition = "2021"
description = "OmarchyConnect desktop daemon (Arch / Omarchy) — pair phone, forward input, run commands"
license = "MIT"

[[bin]]
name = "omarchy-connect"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rand = "0.8"
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
ecdsa = { version = "0.16", features = ["der"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }
libc = "0.2"

[profile.release]
lto = true
strip = true
