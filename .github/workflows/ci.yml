name: CI Checks

on:
  push:
    branches: [ dev/android, dev/linux ]
  pull_request:
    branches: [ dev/android, dev/linux ]

jobs:
  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev/android' || contains(github.event.commits.*.modified, 'android-app/')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        working-directory: android-app
        run: chmod +x gradlew

      - name: Run Lint
        working-directory: android-app
        run: ./gradlew lintDebug --no-daemon

  linux-check:
    name: Linux Clippy & Fmt
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev/linux' || contains(github.event.commits.*.modified, 'linux-app/')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run Clippy
        working-directory: linux-app
        run: cargo clippy -- -D warnings

      - name: Check Format
        working-directory: linux-app
        run: cargo fmt -- --check
