name: CI

on:
  push:
    branches: [ dev/android, dev/linux, main ]
  pull_request:
    branches: [ dev/android, dev/linux, main ]

jobs:
  lint-android:
    name: Lint Android
    runs-on: ubuntu-latest
    if: contains(github.event.commits.*.modified, 'android-app/') || contains(github.event.pull_request.body, 'android')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if android-app exists
        id: check_android
        run: |
          if [ -d "android-app" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        if: steps.check_android.outputs.exists == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Android Lint
        if: steps.check_android.outputs.exists == 'true'
        run: |
          cd android-app
          chmod +x ./gradlew
          ./gradlew lintDebug --no-daemon --stacktrace

  lint-linux:
    name: Lint Linux
    runs-on: ubuntu-latest
    if: contains(github.event.commits.*.modified, 'linux-app/') || contains(github.event.pull_request.body, 'linux')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if linux-app exists
        id: check_linux
        run: |
          if [ -d "linux-app" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust
        if: steps.check_linux.outputs.exists == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run Clippy
        if: steps.check_linux.outputs.exists == 'true'
        run: cd linux-app && cargo clippy --locked -- -D warnings

      - name: Run Rustfmt
        if: steps.check_linux.outputs.exists == 'true'
        run: cd linux-app && cargo fmt --locked -- --check

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Android formatting
        if: contains(github.event.commits.*.modified, 'android-app/')
        run: |
          if [ -d "android-app" ]; then
            cd android-app
            chmod +x ./gradlew
            ./gradlew spotlessCheck --no-daemon
          fi

      - name: Check Rust formatting
        if: contains(github.event.commits.*.modified, 'linux-app/')
        run: |
          if [ -d "linux-app" ]; then
            cd linux-app
            cargo fmt --locked -- --check
          fi
