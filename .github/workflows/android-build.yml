name: Android Build

on:
  push:
    branches: [ dev/android ]
    paths:
      - 'android-app/**'
  pull_request:
    branches: [ dev/android ]
    paths:
      - 'android-app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List files for debugging
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Android app directory:"
          ls -la android-app/ 2>/dev/null || echo "android-app not found"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK Command Line Tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --sdk_root=${ANDROID_HOME} --licenses > /dev/null
          sdkmanager --sdk_root=${ANDROID_HOME} "platforms;android-34" "build-tools;34.0.0" "platform-tools" "emulator" > /dev/null

      - name: Set ANDROID_SDK_ROOT
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x android-app/gradlew

      - name: Build Debug APK
        run: cd android-app && ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Build Release APK
        run: cd android-app && ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OmarchyConnect-Android-Debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OmarchyConnect-Android-Release
          path: android-app/app/build/outputs/apk/release/*.apk
          retention-days: 30
