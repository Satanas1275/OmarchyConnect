name: Android Build

on:
  push:
    branches: [ dev/android ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ dev/android ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # NOTE POUR LE FUTUR MOI (écrite les larmes aux yeux après 3 builds
      # explosés en CI avec un "ClassNotFoundException: GradleWrapperMain") :
      # le gradlew bricolé à la main + son wrapper.jar voleurs ont été jetés,
      # tout est régénéré proprement via `gradle wrapper --gradle-version 8.9`.
      # Ne MODIFIE JAMAIS gradlew/gradlew.bat/gradle-wrapper.jar à la main.
      # Si le build casse de nouveau, regarde d'abord cette étape de check :
      # elle doit afficher "Gradle X.Y" — sinon le wrapper est à nouveau cassé.
      - name: Sanity check Gradle wrapper
        run: |
          ls -la android-app/gradle/wrapper/
          cd android-app
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug and Release APK
        working-directory: android-app
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OmarchyConnect-Android-Debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OmarchyConnect-Android-Release
          path: android-app/app/build/outputs/apk/release/*.apk
          retention-days: 30
