name: Android Build

on:
  push:
    branches: [ dev/android, main ]
  pull_request:
    branches: [ dev/android, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./android-app/gradlew

      - name: Build with Gradle
        run: cd android-app && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: cd android-app && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v3
        with:
          name: OmarchyConnect-Android-Debug
          path: android-app/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v3
        with:
          name: OmarchyConnect-Android-Release
          path: android-app/app/build/outputs/apk/release/*.apk
