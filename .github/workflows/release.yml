name: Create Release

on:
  workflow_run:
    workflows: ["Android Build", "Linux Build"]
    types:
      - completed
    branches:
      - main

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: OmarchyConnect-Android-Release
          path: release/android

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: OmarchyConnect-Linux-Release
          path: release/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: OmarchyConnect v${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          body: |
            ## OmarchyConnect Release
            
            ### Android
            - Release APK built
            - Supports Android 7.0+ (API 24+)
            
            ### Linux
            - Built for x86_64
            - Supports Bluetooth, WiFi, and Internet connections
            
            ### Features
            - Notifications sync
            - File transfer
            - Clipboard sync
            - Command execution
            - Keyboard/Mouse input
            - Theme synchronization
          files: |
            release/android/*.apk
            release/linux/omarchy-connect
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
