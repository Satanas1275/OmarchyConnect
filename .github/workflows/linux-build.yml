name: Linux Build

on:
  push:
    branches: [ dev/linux ]
    paths:
      - 'linux-app/**'
  pull_request:
    branches: [ dev/linux ]
    paths:
      - 'linux-app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Linux App
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List files for debugging
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Linux app directory:"
          ls -la linux-app/ 2>/dev/null || echo "linux-app not found"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbluetooth-dev libdbus-1-dev pkg-config

      - name: Create linux-app directory if not exists
        run: mkdir -p linux-app/src

      - name: Create minimal Cargo.toml if not exists
        run: |
          if [ ! -f "linux-app/Cargo.toml" ]; then
            cat > linux-app/Cargo.toml << 'EOF'
[package]
name = "omarchy-connect"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
EOF
          fi

      - name: Create minimal main.rs if not exists
        run: |
          if [ ! -f "linux-app/src/main.rs" ]; then
            cat > linux-app/src/main.rs << 'EOF'
fn main() {
    println!("OmarchyConnect - Linux App");
}
EOF
          fi

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            linux-app/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('linux-app/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Release
        working-directory: linux-app
        run: cargo build --release

      - name: Run tests
        working-directory: linux-app
        run: cargo test || echo "No tests found, continuing..."

      - name: Upload Release Binary
        uses: actions/upload-artifact@v4
        with:
          name: OmarchyConnect-Linux-Release
          path: linux-app/target/release/omarchy-connect
          retention-days: 30
