name: Linux Build

on:
  push:
    branches: [ dev/linux, main ]
  pull_request:
    branches: [ dev/linux, main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbluetooth-dev libdbus-1-dev pkg-config

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build in debug mode
        run: cd linux-app && cargo build --locked

      - name: Build in release mode
        run: cd linux-app && cargo build --locked --release

      - name: Run tests
        run: cd linux-app && cargo test --locked

      - name: Upload Debug Binary
        uses: actions/upload-artifact@v3
        with:
          name: OmarchyConnect-Linux-Debug
          path: linux-app/target/debug/omarchy-connect

      - name: Upload Release Binary
        uses: actions/upload-artifact@v3
        with:
          name: OmarchyConnect-Linux-Release
          path: linux-app/target/release/omarchy-connect

  build-android-library:
    name: Build Android Library (for integration)
    runs-on: ubuntu-latest
    needs: build-linux
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Android library
        run: |
          cd android-app
          ./gradlew :app:assembleDebug
